name: Release

# Each push to main (a merged pull request) can make a new version. The commit types decide:
# feat gives a minor version, fix and perf give a patch version, and a "!" or a BREAKING CHANGE line gives a major version.
# Other types (docs, test, chore, ci) make no release.
# The workflow builds the installers and makes a DRAFT release. The owner publishes the draft by hand.
# The tag does not exist until the owner publishes the draft.
on:
  push:
    branches: [main]
  # A manual run builds the installers and keeps them as workflow artifacts for 7 days. It makes no release.
  workflow_dispatch:

permissions:
  contents: read

# A run that waits is replaced by a newer one. A run that works is never stopped half way.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: Choose the version
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.next.outputs.release }}
      version: ${{ steps.next.outputs.version }}
      previous: ${{ steps.next.outputs.previous }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The full history and the tags, to find the last release and the commits after it.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - id: next
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/release-version.ts

  build:
    name: Build (${{ matrix.name }})
    needs: version
    if: needs.version.outputs.release == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: Windows
            os: windows-latest
            builder-args: --win
            # The path of the unpacked app, for the smoke test.
            packaged: dist/win-unpacked/Hive.exe
          - name: macOS
            os: macos-latest
            builder-args: --mac --arm64 --x64
            packaged: dist/mac-arm64/Hive.app/Contents/MacOS/Hive
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

      # The tag is the version. The file package.json keeps its old number in the repository.
      # Inside this build, the number is set, so the installers and the app itself report the new version.
      - name: Set the version
        if: needs.version.outputs.release == 'true'
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: npm version "${VERSION}" --no-git-tag-version --allow-same-version

      # No certificate is configured. Windows skips the signing. The hook scripts/ad-hoc-sign.cjs signs the Mac app ad hoc.
      - name: Build the installers
        run: npm run dist:release -- ${{ matrix.builder-args }} --publish never

      - name: Show the signature of the Mac app
        if: runner.os == 'macOS'
        run: |
          codesign --display --verbose=2 dist/mac-arm64/Hive.app
          codesign --verify --deep --strict --verbose=2 dist/mac-arm64/Hive.app

      # Start the unpacked app. This proves that the native terminal module loads from the packaged files.
      - name: Smoke test the packaged app
        shell: bash
        env:
          HIVE_E2E_PACKAGED: ${{ github.workspace }}/${{ matrix.packaged }}
        run: npx tsx --test e2e/packaged.e2e.ts

      - uses: actions/upload-artifact@v7
        with:
          name: installers-${{ matrix.name }}
          path: |
            dist/Hive-*.exe
            dist/Hive-*.dmg
            dist/Hive-*.zip
          if-no-files-found: error
          retention-days: 7

  release:
    name: Make the draft release
    if: github.event_name == 'push' && needs.version.outputs.release == 'true'
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.version.outputs.version }}
      PREVIOUS: ${{ needs.version.outputs.previous }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          path: installers
          merge-multiple: true

      - name: Write the release notes
        run: |
          range="${PREVIOUS:+${PREVIOUS}..}HEAD"
          {
            # The marker tells the next run that it can replace this draft.
            echo "<!-- hive-auto-release -->"
            echo "## Changes"
            echo
            changes="$(git log --no-merges --pretty='- %s' "${range}" | grep -v -E '^- (chore|ci|docs|test|build|style)(\(.*\))?:' || true)"
            if [ -n "${changes}" ]; then echo "${changes}"; else echo "- No change that users can see."; fi
            echo
            echo "## Install"
            echo
            echo "- **Windows:** run the file ending in \`win-x64.exe\`. Windows SmartScreen warns about an unknown publisher, because the installer is not signed. Choose \"More info\", then \"Run anyway\"."
            echo "- **macOS:** open the \`.dmg\` for your Mac and drag Hive to Applications. Use \`arm64\` for Apple Silicon and \`x64\` for an Intel Mac. The app is not notarized. The first time, open it with a right click and \"Open\"."
          } > notes.md
          cat notes.md

      # An earlier run can have left a draft for changes that are not published yet. This run covers those changes too,
      # so the old draft goes. Only a draft with the marker goes. A draft that the owner made by hand stays.
      - name: Remove the old automatic drafts
        run: |
          gh api --paginate "repos/${GITHUB_REPOSITORY}/releases" \
            --jq '.[] | select(.draft and ((.body // "") | contains("hive-auto-release"))) | .id' |
            while read -r id; do
              echo "Remove the old draft ${id}."
              gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/${id}"
            done

      # The release is a draft. The owner reads the notes and the files, and then publishes it.
      # GitHub makes the tag v<version> on the commit of this run when the owner publishes the draft.
      - name: Create the draft release
        run: |
          gh release create "v${VERSION}" installers/* \
            --draft \
            --target "${GITHUB_SHA}" \
            --title "Hive ${VERSION}" \
            --notes-file notes.md
